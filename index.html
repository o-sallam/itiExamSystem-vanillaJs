<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam System</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/4c8b629b2c.js" crossorigin="anonymous"></script>
    </head>




<body>

<main class="container">
<!-- <nav>
  <div class="loginBtn">Login</div>
  
  <div class="WebsiteNam">Examium</div> -->
  <div class="formBox">
    <h1 id="title">Sign Up</h1>
    <form action="">
      <div class="inputGroup">
        <div class="inputField" id="nameField">
          <i class="fa-solid fa-user"></i>
          <input type="text" placeholder="Enter Your user name" >
        </div>
        <div class="inputField">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" placeholder="Enter Your Email" >
        </div>
        <div class="inputField">
          <i class="fa-solid fa-lock"></i>
          <input type="password" placeholder="Enter Your password" >
        </div>
      </div>
      <div class="btnField">
        <input class="btnsign" id="signUpBtn" type="button" value="Sign Up">
        <input class="btnsign disabled" id="signInBtn"  type="button" value="Sign in">

      </div>
    </form>
  </div>
</nav>

 

</main>
  <footer>
    <h3 class="teamNames"> Created by ITI Alrish Mearn Stack Team: Omar Sallam , Mohammad Mansour</h3>
  </footer>
    <script src="main.js"></script>
  </body>
</html>
