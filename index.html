<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exam System</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <div class="container">
      <!-- Navigation Bar -->
      <nav class="navbar">
        <div class="nav-content">
          <h1 class="website-title">Exam System</h1>
          <div class="search-box">
            <input type="text" placeholder="Search..." />
            <i class="fas fa-search"></i>
          </div>
          <button class="logout-btn">
            <i class="fas fa-sign-out-alt"></i>
            Logout
          </button>
        </div>
      </nav>

      <!-- Card Section -->
      <section class="card-section">
        <div class="card">
          <div class="card-img-container">
            <img src="https://picsum.photos/300/200?random=1" alt="Card Image" />
          </div>

          <div class="card-content">
            <h3>Card Title 1</h3>
            <p>This is a sample description for card 1.</p>
          </div>
        </div>

        <div class="card">
          <div class="card-img-container">
            <img src="https://picsum.photos/300/200?random=2" alt="Card Image" />
          </div>
          <div class="card-content">
            <h3>Card Title 2</h3>
            <p>This is a sample description for card 2.</p>
          </div>
        </div>

        <div class="card">
          <div class="card-img-container">
            <img src="https://picsum.photos/300/200?random=3" alt="Card Image" />
          </div>
          <div class="card-content">
            <h3>Card Title 3</h3>
            <p>This is a sample description for card 3.</p>
          </div>
        </div>

        <div class="card">
          <div class="card-img-container">
            <img src="https://picsum.photos/300/200?random=4" alt="Card Image" />
          </div>
          <div class="card-content">
            <h3>Card Title 4</h3>
            <p>This is a sample description for card 4.</p>
          </div>
        </div>
      </section>
    </div>

    <script src="main.js"></script>
  </body>
</html>
